name: Build

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  deploy_staging:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    env:
      MPKIT_URL: ${{ secrets.MPKIT_URL_STAGING }}
      MPKIT_EMAIL: ${{ secrets.MPKIT_EMAIL }}
      MPKIT_TOKEN: ${{ secrets.MPKIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Build graphql docs
        run: npm run build:graphql
      - name: Deploy to staging
        run: npx @platformos/pos-cli deploy

  test_staging:
    needs: deploy_staging
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    env:
      MPKIT_URL: ${{ secrets.MPKIT_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # codeceptjs 4.2 needs Node >= 22.12; on Node 20 npm falls back to 4.1.0,
          # whose custom locators ($lastEdit) do not find elements that are on the page.
          node-version: '22'
      - name: Install test framework
        run: npm i codeceptjs@4.2.0 @codeceptjs/configure@4.0.0-beta.4 puppeteer@25.12.0
      - name: Warm up staging
        # The tests start right after the deploy; the first page loads are slow then.
        run: |
          for path in / /get-started /roadmap /release-notes /api-reference/liquid/introduction /api-reference/liquid/types /use-cases/authenticating-user-with-jwt; do
            curl -s -o /dev/null -w "%{http_code} %{time_total}s $path\n" "${MPKIT_URL%/}$path"
          done
      - run: npm test

  deploy_production:
    needs: test_staging
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
    env:
      MPKIT_URL: ${{ secrets.MPKIT_URL_PRODUCTION }}
      MPKIT_EMAIL: ${{ secrets.MPKIT_EMAIL }}
      MPKIT_TOKEN: ${{ secrets.MPKIT_TOKEN_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Build graphql docs
        run: npm run build:graphql
      - name: Deploy production
        run: npx @platformos/pos-cli deploy
      - name: Warm cache
        run: time curl $MPKIT_URL >> /dev/null
      - run: time curl $MPKIT_URL >> /dev/null
      - run: time curl $MPKIT_URL >> /dev/null
      - run: time curl $MPKIT_URL >> /dev/null
      - run: time curl $MPKIT_URL >> /dev/null

